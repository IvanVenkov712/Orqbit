name: PostgreSQL checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: orqbit_test
          POSTGRES_PASSWORD: test_only
          POSTGRES_DB: orqbit_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U orqbit_test -d orqbit_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://orqbit_test:test_only@localhost:5432/orqbit_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install uv
        run: python -m pip install uv==0.13.7
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Lint
        run: uv run --locked ruff check .
      - name: Check Python syntax
        run: uv run --locked python -m compileall -q src migrations tests
      - name: Migrate and test against PostgreSQL
        run: uv run --locked pytest -q
